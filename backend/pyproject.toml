[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." makes "app" importable (backend/app).
# ".." makes "lab" importable (lab/ sits at the project root, one level above backend/).
pythonpath = [".", ".."]
